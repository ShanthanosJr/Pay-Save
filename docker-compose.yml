services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: payandsave
      POSTGRES_PASSWORD: payandsave   # local development only
      POSTGRES_DB: payandsave
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
